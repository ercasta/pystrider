[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrider"
version = "0.0.1"
description = "Reads and writes Python by reasoning, on ugm's microfunctions engine."
requires-python = ">=3.11"
dependencies = ["universal-graph-machine"]

[project.optional-dependencies]
dev = ["pytest"]
experiments = ["textual>=8,<9"]   # drives the emitted apps through textual's Pilot

[tool.setuptools]
# ⚠ 2026-08-02: the previous generation (the `ugm`-classic `pystrider` package and its `grammapy` peer)
# was retired and `strider/` took the name. `hypothesis` went with grammapy's property tests.
packages = ["pystrider"]

[tool.setuptools.package-data]
pystrider = ["rules/*.mf"]
