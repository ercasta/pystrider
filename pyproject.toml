[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrider"
version = "0.0.1"
description = "Reads and writes Python by reasoning, on harneskills' entity-component world."
requires-python = ">=3.11"

# ⚠⚠ `universal-graph-machine` is GONE from this list, and the whole of `../ugm` with
# it -- that checkout, at that path, is retired. `ugm` is back as a DIFFERENT
# thing (harneskills 37d6fca): the entity-component engine `harneskills` used to
# carry itself, carved into its own package and embedded at `../harneskills/engine`
# (import name `ugm`; see `tests/conftest.py`'s own account of why this name is
# worth this much caution). `harneskills` is deliberately NOT listed here either,
# and neither is `ugm`: both are a sibling checkout under active development, not
# a release, so pinning either in metadata would promise a version that does not
# exist.
#
# ⚠⚠ 2026-08-28: `_NEEDS` IS GONE, and this is the one place that promised it. It
# asserted the `ugm` names this package uses, on import, so drift failed by NAME
# rather than three frames into a run -- and it could do that because `facts.py`
# lived HERE while the world it adapted lived over there. `facts.py` and
# `arbitration.py` have moved into `ugm` itself, so those names now version with the
# world they name and there is no gap left to assert across. The dependency is
# WIDER as a result, not narrower: this package imports a vocabulary from `ugm` now,
# not just a store and a loop. What catches a moved `ugm` is the suite --
# `tests/conftest.py` names which one a run got, and `test_the_world_SETTLES` is
# what notices behaviour rather than names.
#
#   PYTHONPATH=../harneskills/engine:../harneskills python -m pytest tests/ -q
#
# ⚠ This machine also has an UNRELATED project also called `ugm`
# (`../Universal-Graph-Machine`) sitting beside this one. Putting it on
# `PYTHONPATH` ahead of `../harneskills/engine` is exactly the old twin-`ugm`
# hazard back again with a new source -- see `tests/conftest.py`.
#
# ⭐ Nothing here defaults to a path any more. `mf.py`'s `UGM` env var (and its
# hard-coded `C:\Users\...` fallback) is gone with the module.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# ⚠ `demos/playground` DRIVES the app it emits — the verification is a real Textual
# app under Pilot, not an inspection of the source. Without this the bridge suite
# skips rather than passing vacuously.
playground = ["textual>=8,<9"]

[tool.setuptools]
# ⚠ 2026-08-26: `rules/` is gone — the descriptions are systems in `patterns.py` and
# `repair.py` now. The one authored-text surface left is `demos/playground/*.cnl`,
# which is a demo rather than package data, and `cnl.py` says why that one stayed text.
# ⚠ `demos.playground` is a PACKAGE, not just a folder, because `pystrider.domain`
# imports it: the playground is what you drive from a harneskills prompt, so it has
# to be importable by the service's interpreter rather than only from a repo cwd.
# ⭐ That is what lets the domain avoid a sys.path hack — this project deleted the
# last one (`mf.py`'s `UGM`) and is not adding another.
packages = ["pystrider", "demos", "demos.playground"]

[tool.setuptools.package-data]
# The authored blocks are read off disk by `brew.py` (`_HERE / f"{name}.cnl"`), so
# they must travel with the package.
"demos.playground" = ["*.cnl"]
