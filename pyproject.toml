[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrider"
version = "0.0.1"
description = "Reads and writes Python by reasoning, on loopingrules' entity-component world."
requires-python = ">=3.11"

# ⚠⚠ 2026-08-29: `ugm` IS GONE, and this package no longer imports a vocabulary
# from it -- `harneskills`'s engine (world/loop/engine/save) was carved out of
# `harneskills` into its OWN repo, `../loopingrules`, and renamed on the way out
# (`ugm.world` -> `loopingrules.world`). Read alongside that: `loopingrules`
# deleted `facts.py`/`arbitration.py` outright rather than carrying them across
# the split (nothing in `harneskills` itself ever imported them), so this package
# no longer imports a generic relation/arbitration vocabulary from its substrate
# at all -- every relation this package used to declare via `relation(name)` is
# now a plain, explicitly-named `@dataclasses.dataclass` component it declares
# itself, read and written straight through `loopingrules.world.World`. See
# `pystrider/patterns.py` for the worked example and `docs/decision_patterns.md`
# for why arbitration stays domain-owned rather than a shared reader.
#
# `harneskills` is deliberately NOT listed here either, and neither is
# `loopingrules`: both are sibling checkouts under active development, not a
# release, so pinning either in metadata would promise a version that does not
# exist.
#
#   PYTHONPATH=../loopingrules python -m pytest tests/ -q
#
# ⭐ Nothing here defaults to a path any more. `mf.py`'s `UGM` env var (and its
# hard-coded `C:\Users\...` fallback) is gone with the module.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# ⚠ `demos/playground` DRIVES the app it emits — the verification is a real Textual
# app under Pilot, not an inspection of the source. Without this the bridge suite
# skips rather than passing vacuously.
playground = ["textual>=8,<9"]

[tool.setuptools]
# ⚠ 2026-08-26: `rules/` is gone — the descriptions are systems in `patterns.py` and
# `repair.py` now. The one authored-text surface left is `demos/playground/*.cnl`,
# which is a demo rather than package data, and `cnl.py` says why that one stayed text.
# ⚠ `demos.playground` is a PACKAGE, not just a folder, because `pystrider.domain`
# imports it: the playground is what you drive from a harneskills prompt, so it has
# to be importable by the service's interpreter rather than only from a repo cwd.
# ⭐ That is what lets the domain avoid a sys.path hack — this project deleted the
# last one (`mf.py`'s `UGM`) and is not adding another.
packages = ["pystrider", "demos", "demos.playground"]

[tool.setuptools.package-data]
# The authored blocks are read off disk by `brew.py` (`_HERE / f"{name}.cnl"`), so
# they must travel with the package.
"demos.playground" = ["*.cnl"]
