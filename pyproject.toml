[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrider"
version = "0.0.1"
description = "Reads and writes Python by reasoning, on harneskills' entity-component world."
requires-python = ">=3.11"

# ⚠⚠ `universal-graph-machine` is GONE from this list, and the whole of `../ugm` with
# it. `harneskills` is deliberately NOT listed here either: it is a sibling checkout
# under active development, not a release, so pinning it in metadata would promise a
# version that does not exist. What guards the dependency instead is `_NEEDS` in
# `pystrider/facts.py` — twelve names asserted on import, which fails by NAME when
# the substrate moves rather than three frames into a run.
#
#   PYTHONPATH=../harneskills python -m pytest tests/ -q
#
# ⭐ Nothing here defaults to a path any more. `mf.py`'s `UGM` env var (and its
# hard-coded `C:\Users\...` fallback) is gone with the module.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# ⚠ `demos/playground` DRIVES the app it emits — the verification is a real Textual
# app under Pilot, not an inspection of the source. Without this the bridge suite
# skips rather than passing vacuously.
playground = ["textual>=8,<9"]

[tool.setuptools]
# ⚠ 2026-08-26: `rules/` is gone — the descriptions are systems in `patterns.py` and
# `repair.py` now. The one authored-text surface left is `demos/playground/*.cnl`,
# which is a demo rather than package data, and `cnl.py` says why that one stayed text.
packages = ["pystrider"]
