site_name: pystrider
site_description: >
  Trustworthy code generation and checking by a symbolic core plus execution — with a language model
  nowhere in the trust path.
site_url: https://ercasta.github.io/pystrider/
repo_url: https://github.com/ercasta/pystrider
repo_name: ercasta/pystrider
copyright: >
  Every line derived by reasoning, trusted by execution ·
  <a href="https://github.com/ercasta/pystrider">View the project on GitHub</a>

docs_dir: docs

# Simple, deterministic paths (generate.html, wheels/, play/) so the live pages can reference the
# Pyodide wheels and the .py sources with plain relative URLs.
use_directory_urls: false

# The dated historical logs live in docs/ for the repo's own record, but are not part of the
# published site (which presents only the current generation of the system).
#
# ⚠ 2026-08-02: the generation this site DESCRIBES was retired (see the nav note below), so most of
# what remains here documents code that no longer exists. It is excluded rather than deleted until
# the site is re-authored, so the prose survives for the record without being published as current.
exclude_docs: |
  critique.md
  spike_findings.md
  implementation_plan.md
  deep_dive.md
  understanding_findings.md
  roadmap.md
  oracle_contracts.md
  the_case.md
  ast_representation_findings.md
  vocabulary_bridge.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ercasta/pystrider
      name: pystrider on GitHub

extra_css:
  - stylesheets/extra.css

# ⚠ 2026-08-02 — THE SITE AWAITS RE-AUTHORING, and the nav is short because of it, not because pages
# were lost. The two live Pyodide playgrounds ran `demos/playground/`, and the pages around them
# described `grammapy` and the `ugm`-classic `pystrider`; all of that was retired when `strider/` took
# the name. Publishing them would have been a site describing code that is not in the repo. They are
# deleted rather than fixed because the new generation authors `.mf` rather than CNL, so the playgrounds
# are a rewrite and not a repair. `pystrider/HANDOFF.md` is the current front door until this is redone.
nav:
  - Home: index.md
